[project]
name = "dependency-cache-layer-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pytest>=8.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
# Make the repo root importable so `uv run pytest` works from the repo root
# without any extra startup flags or wrappers.
pythonpath = ["."]
testpaths = ["tests"]
